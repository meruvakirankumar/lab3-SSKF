[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "clients",
    "models",
    "cryptography>=46.0.3",
    "fastapi[standard-no-fastapi-cloud-cli]==0.116.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.10.1",
    "twilio>=9.0.0",
    "uvicorn[standard]==0.35.0",
    "requests>=2.31.0",
]

[project.scripts]
app = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src" = "."

[tool.uv.sources]
clients = { path = "../../clients/python", editable = true }
models = { path = "../../models/python", editable = true }
